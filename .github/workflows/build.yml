# Đóng gói PostureGuard cho Windows và macOS, chạy tự kiểm tra trên máy thật của GitHub,
# và khi đẩy tag v* thì đăng file cài lên trang Releases.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  MODEL_URL: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-14   # Apple Silicon (M1 trở lên)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.8

      - name: Tải mô hình nhận diện
        run: curl -fsSL -o pose_landmarker_lite.task "$MODEL_URL"

      - name: Tự kiểm tra (mã nguồn)
        env:
          PYTHONUTF8: "1"
        run: python posture_guard.py --self-test

      - name: Đóng gói bằng PyInstaller
        run: pyinstaller --noconfirm packaging/PostureGuard.spec

      - name: Tự kiểm tra (app đóng gói) – Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PostureGuard\PostureGuard.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$HOME\.posture_guard\app.log" -Encoding utf8 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Tự kiểm tra (app đóng gói) – macOS
        if: runner.os == 'macOS'
        run: |
          dist/PostureGuard.app/Contents/MacOS/PostureGuard --self-test || { cat ~/.posture_guard/app.log; exit 1; }

      - name: Tạo bộ cài Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.Substring(1) } else { "1.0.0" }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path dist\PostureGuard -DestinationPath dist\PostureGuard-Windows-portable.zip

      - name: Thử cài, chạy và gỡ bộ cài Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process dist\PostureGuard-Setup-Windows.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=startup' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\PostureGuard\PostureGuard.exe"
          if (-not (Test-Path $exe)) { Write-Error "Không thấy $exe sau khi cài"; exit 1 }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').PostureGuard
          if ($run -ne "`"$exe`"") { Write-Error "Mục tự chạy sai: $run"; exit 1 }
          Get-Process PostureGuard -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item "$HOME\.posture_guard\app.log" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$HOME\.posture_guard\app.log" -Encoding utf8 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }
          Start-Process "$env:LOCALAPPDATA\Programs\PostureGuard\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Start-Sleep 3
          if (Test-Path $exe) { Write-Error "Gỡ cài đặt không xóa app"; exit 1 }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').PostureGuard) { Write-Error "Gỡ cài đặt không xóa mục tự chạy"; exit 1 }
          Write-Host "Cài – chạy – gỡ: OK"

      - name: Nén app macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/PostureGuard.app dist/PostureGuard-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PostureGuard-${{ runner.os }}
          path: |
            dist/PostureGuard-Setup-Windows.exe
            dist/PostureGuard-Windows-portable.zip
            dist/PostureGuard-macOS.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            ## Tải về
            - **Windows 10/11:** [PostureGuard-Setup-Windows.exe](https://github.com/${{ github.repository }}/releases/latest/download/PostureGuard-Setup-Windows.exe) – mở file và bấm Next để cài.
            - **macOS (máy Apple M1 trở lên):** [PostureGuard-macOS.zip](https://github.com/${{ github.repository }}/releases/latest/download/PostureGuard-macOS.zip) – giải nén, kéo PostureGuard vào thư mục Applications.

            Hướng dẫn cài và dùng chi tiết: xem [README](https://github.com/${{ github.repository }}#readme).
