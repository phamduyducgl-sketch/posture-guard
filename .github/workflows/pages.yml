# Đưa web app "Ngồi Ngay Ngắn" (thư mục web/) lên GitHub Pages.
name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm thử phần đo tư thế
        run: node --check web/app.js && node --check web/sw.js && node tests/test_posture.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
